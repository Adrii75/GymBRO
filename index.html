<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#08111f" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<title>ADRI Fit</title>
<style>
:root{--bg:#07101d;--card:#0f1b2d;--card2:#142238;--txt:#f8fafc;--muted:#94a3b8;--line:#24344d;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#38bdf8;--purple:#a78bfa}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#08111f,#0b1322);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:14px 14px 118px}.top{position:sticky;top:0;z-index:30;background:rgba(8,17,31,.95);backdrop-filter:blur(12px);padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}.brand{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand h1{font-size:23px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:#122642;border:1px solid #2b496c;color:#c8e9ff}.mainnav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.navbtn,.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:10px 6px;border-radius:12px;font-weight:800}.navbtn.active,.tab.active{background:#19304f;color:white;border-color:#315a8d}.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:11px 0}.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.18)}.hero{height:210px;background:#0a1220;position:relative;overflow:hidden;cursor:pointer}.hero img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#08111f}.hero-tools{position:absolute;z-index:3;top:10px;right:10px;display:flex;gap:8px}.hero-chip{border:1px solid rgba(255,255,255,.2);background:rgba(8,17,31,.78);color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.weightrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.weighthist{display:grid;gap:8px;margin-top:8px}.weightitem{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #213047}.weightitem:last-child{border-bottom:0}.substats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.substat{background:#0b1628;border:1px solid #20324b;border-radius:12px;padding:10px}.substat b{display:block;font-size:16px}.substat span{font-size:11px;color:var(--muted)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(5,10,18,.88))}.hero-title{position:absolute;z-index:2;left:14px;right:14px;bottom:12px}.hero-title h2{margin:0;font-size:19px}.hero-title .meta{font-size:12px;color:#cbd5e1;margin-top:3px}.body{padding:14px}.cue{font-size:13px;color:#cbd5e1;background:#0b1628;border-left:3px solid var(--blue);padding:9px 10px;border-radius:8px;margin-bottom:10px}.suggest{font-size:12px;color:#e2e8f0;background:#18243a;border:1px solid #2c4264;padding:9px 10px;border-radius:10px;margin-bottom:10px}.sets-head,.setrow{display:grid;grid-template-columns:38px 1fr 1fr 52px;gap:8px;align-items:center}.sets-head{font-size:11px;color:var(--muted);padding:4px 0 6px}.setrow{margin:7px 0}.setrow input{width:100%;background:#091525;border:1px solid #2a3c59;color:white;border-radius:10px;padding:10px 8px;font-size:15px}.setnum{font-weight:800;text-align:center;color:#cbd5e1}.check{height:42px;border:1px solid #355172;background:#10213a;color:white;border-radius:11px;font-size:19px}.check.done{background:#14532d;border-color:#22c55e}.actions{display:flex;gap:8px;margin-top:11px}.btn{flex:1;border:1px solid transparent;border-radius:11px;padding:11px 10px;font-weight:800}.video{background:#ef4444;color:white}.note{background:#20324e;color:white}.ghost{background:#101c2e;color:#dbeafe;border-color:#2a3c59}.danger{background:#351622;color:#fecdd3;border-color:#6f263c}.prev{font-size:11px;color:var(--muted);margin-top:6px}.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(730px,calc(100% - 24px));z-index:50;background:#0b1729;border:1px solid #345172;border-radius:18px;padding:12px 14px;display:none;box-shadow:0 16px 50px rgba(0,0,0,.45)}.timerbar.show{display:flex;align-items:center;gap:12px}.ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#122642;border:4px solid #38bdf8;font-size:17px;font-weight:900}.timertext{flex:1}.timertext b{display:block}.timertext span{font-size:12px;color:var(--muted)}.timerbtns{display:flex;gap:6px}.mini{border:1px solid #345172;background:#13253e;color:white;border-radius:9px;padding:8px}.finish{width:100%;margin-top:16px;background:var(--green);border:0;color:#04210d;font-weight:900;font-size:16px;padding:14px;border-radius:14px}.small{font-size:12px;color:var(--muted)}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#0f2d1b;border:1px solid #22c55e;padding:10px 14px;border-radius:12px;z-index:99;display:none}.toast.show{display:block}.hidden{display:none!important}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.section-title h2,.section-title h3{margin:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow,.calday{text-align:center;font-size:11px;padding:7px 3px;border-radius:9px}.dow{color:var(--muted)}.calday{background:#0b1628;border:1px solid #1f3048;min-height:34px}.calday.has{background:#143c2a;border-color:#256c47;color:#bbf7d0;font-weight:800}.calday.today{outline:2px solid var(--blue)}.histrow{padding:10px 0;border-bottom:1px solid #213047}.histrow:last-child{border-bottom:0}.badge{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:#1d304b;color:#bfdbfe;margin-left:5px}.pr{color:#fbbf24;font-weight:900}.musclerow{display:grid;grid-template-columns:120px 1fr 38px;gap:9px;align-items:center;margin:8px 0}.bar{height:10px;border-radius:999px;background:#17253a;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#a78bfa)}.chartwrap{height:220px}.chartwrap canvas{width:100%;height:100%}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#091525;border:1px solid #2a3c59;color:white;border-radius:10px;padding:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:grid;place-items:end center;padding:12px}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0c1728;border:1px solid #2b3d58;border-radius:20px;padding:15px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.close{background:transparent;border:0;color:white;font-size:25px}.install{background:#172942;border:1px solid #315a8d;color:#dbeafe;border-radius:12px;padding:10px 12px;font-weight:800}.help{font-size:11px;color:var(--muted);line-height:1.45}.editor-list{display:grid;gap:8px}.editor-item{padding:10px;background:#0b1628;border:1px solid #21324a;border-radius:12px}.editor-item b{display:block}.editor-actions{display:flex;gap:6px;margin-top:8px}.editor-actions button{flex:1}.imgmodal img{width:100%;max-height:58vh;object-fit:contain;background:#08111f;border-radius:14px;border:1px solid #23324a}.imghelp{font-size:12px;color:var(--muted);margin-top:8px}.primary{background:#19304f;color:#fff;border-color:#315a8d}
@media(max-width:540px){.hero{height:180px}.sets-head,.setrow{grid-template-columns:34px 1fr 1fr 48px}.stat{padding:10px}.stat b{font-size:16px}.mainnav{grid-template-columns:repeat(4,1fr)}.navbtn{font-size:11px}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.musclerow{grid-template-columns:95px 1fr 32px}.actions{flex-wrap:wrap}.btn{min-width:44%}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><div><h1>ADRI Fit</h1><div class="sub">Tu gimnasio en casa · progresión · descansos automáticos</div></div><button id="installBtn" class="install hidden">Instalar</button></div></div>
  <div class="mainnav" id="mainnav"></div>
  <div id="screen"></div>
</div>
<div class="timerbar" id="timerbar"><div class="ring" id="timerRing">90</div><div class="timertext"><b>Descanso</b><span id="timerExercise">Siguiente serie</span></div><div class="timerbtns"><button class="mini" onclick="changeTimer(-15)">-15</button><button class="mini" onclick="changeTimer(15)">+15</button><button class="mini" onclick="skipTimer()">Saltar</button></div></div>
<div class="toast" id="toast">Descanso terminado 🔔</div>
<div id="modalRoot"></div>
<script>
const $=id=>document.getElementById(id);
const DEFAULT_DAYS=[
{name:'Lun',title:'Pecho + Bíceps + Core',ex:[
{id:'bench_ez',name:'Press banca con barra EZ/W',sets:4,reps:'6-10',rest:120,muscle:'Pecho',cue:'Agarre cómodo en la curva de la EZ, escápulas atrás y abajo, pies firmes y baja la barra de forma controlada hacia la zona media-baja del pecho. Deja 1-2 repeticiones en reserva si entrenas solo.',img:'https://i.ytimg.com/vi/vVoIzRjyRYs/hqdefault.jpg',video:'https://www.youtube.com/watch?v=vVoIzRjyRYs'},
{id:'incline_db',name:'Press inclinado con mancuernas',sets:3,reps:'8-12',rest:90,muscle:'Pecho',cue:'Banco 30-45°. No conviertas el movimiento en press militar.',img:'https://i.ytimg.com/vi/0G2_XV7slIg/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=press+inclinado+mancuernas+tecnica'},
{id:'db_fly',name:'Aperturas con mancuernas en banco',sets:3,reps:'10-15',rest:75,muscle:'Pecho',cue:'Codos ligeramente flexionados, escápulas apoyadas y abre solo hasta donde el hombro esté cómodo. Junta las mancuernas usando el pecho, sin chocarlas.',img:'https://i.ytimg.com/vi/QENKPHhQVi4/hqdefault.jpg',video:'https://www.youtube.com/watch?v=QENKPHhQVi4'},
{id:'ez_curl',name:'Curl con barra EZ',sets:4,reps:'8-12',rest:75,muscle:'Bíceps',cue:'Codos quietos y sin balanceo.',img:'https://i.ytimg.com/vi/zG2xJ0Q5QtI/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=curl+barra+ez+tecnica'},
{id:'hammer',name:'Curl martillo',sets:3,reps:'10-15',rest:75,muscle:'Bíceps',cue:'Muñeca neutra; no eches el codo hacia atrás.',img:'https://i.ytimg.com/vi/zC3nLlEvin4/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=curl+martillo+tecnica'},
{id:'abwheel',name:'Rueda abdominal',sets:3,reps:'6-12',rest:75,muscle:'Core',cue:'Aprieta abdomen y glúteos; evita arquear la zona lumbar.',img:'https://i.ytimg.com/vi/A3uK5TPzHq8/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=rueda+abdominal+tecnica'}]},
{name:'Mar',title:'Espalda + Tríceps',ex:[
{id:'onearm_row',name:'Remo a una mano con mancuerna',sets:4,reps:'8-12',rest:90,muscle:'Espalda',cue:'Lleva el codo hacia la cadera sin girar el tronco.',img:'https://i.ytimg.com/vi/pYcpY20QaE8/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=remo+una+mano+mancuerna+tecnica'},
{id:'ez_row',name:'Remo inclinado con barra EZ',sets:4,reps:'8-12',rest:120,muscle:'Espalda',cue:'Bisagra de cadera y espalda neutra; barra hacia abdomen.',img:'https://i.ytimg.com/vi/FWJR5Ve8bnQ/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=remo+inclinado+barra+tecnica'},
{id:'rear_fly',name:'Pájaros con mancuernas',sets:3,reps:'12-20',rest:60,muscle:'Hombro posterior',cue:'Peso ligero, hombros lejos de las orejas.',img:'https://i.ytimg.com/vi/EA7u4Q_8HQ0/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=pajaros+mancuernas+tecnica'},
{id:'skull',name:'Tríceps tumbado con barra EZ',sets:4,reps:'8-12',rest:75,muscle:'Tríceps',cue:'Mantén el brazo estable y flexiona el codo.',img:'https://i.ytimg.com/vi/d_KZxkY_0cM/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=rompecraneos+barra+ez+tecnica'},
{id:'close_push2',name:'Flexiones cerradas',sets:3,reps:'8-20',rest:75,muscle:'Tríceps',cue:'Codos pegados y abdomen firme.',img:'https://i.ytimg.com/vi/J0DnG1_S92I/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=flexiones+cerradas+tecnica'}]},
{name:'Jue',title:'Pierna + Core',ex:[
{id:'goblet',name:'Sentadilla goblet',sets:4,reps:'8-12',rest:120,muscle:'Pierna',cue:'Rodillas siguen la línea de los pies.',img:'https://i.ytimg.com/vi/MeIiIdhvXT4/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=sentadilla+goblet+tecnica'},
{id:'rdl',name:'Peso muerto rumano con mancuernas',sets:4,reps:'8-12',rest:120,muscle:'Isquios / glúteo',cue:'Cadera atrás, rodillas suaves y mancuernas cerca de las piernas.',img:'https://i.ytimg.com/vi/FQKfr1YDhEk/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=peso+muerto+rumano+mancuernas+tecnica'},
{id:'bulgarian',name:'Sentadilla búlgara',sets:3,reps:'8-12/lado',rest:90,muscle:'Pierna',cue:'Pie delantero estable y bajada controlada.',img:'https://i.ytimg.com/vi/2C-uNgKwPLE/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=sentadilla+bulgara+mancuernas+tecnica'},
{id:'hipthrust',name:'Hip thrust con mancuerna',sets:3,reps:'10-15',rest:90,muscle:'Glúteo',cue:'Mentón recogido; termina con glúteo, no arqueando la espalda.',img:'https://i.ytimg.com/vi/LM8XHLYJoYs/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=hip+thrust+mancuerna+tecnica'},
{id:'calves',name:'Elevaciones de gemelos con mancuernas',sets:4,reps:'12-20',rest:60,muscle:'Gemelos',cue:'Sube todo lo posible sobre la punta de los pies, pausa arriba y baja lentamente sin rebotar.',img:'https://i.ytimg.com/vi/xzhX4SQEMvM/hqdefault.jpg',video:'https://www.youtube.com/watch?v=xzhX4SQEMvM'},
{id:'abwheel2',name:'Rueda abdominal',sets:3,reps:'6-12',rest:75,muscle:'Core',cue:'Recorrido que puedas controlar sin colapsar lumbar.',img:'https://i.ytimg.com/vi/A3uK5TPzHq8/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=rueda+abdominal+tecnica'}]},
{name:'Vie',title:'Torso B + Brazos',ex:[
{id:'shoulderpress',name:'Press hombro con mancuernas',sets:3,reps:'8-12',rest:90,muscle:'Hombro',cue:'Costillas abajo y core firme. No arquees la zona lumbar.',img:'https://i.ytimg.com/vi/qEwKCR5JCog/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=press+hombro+mancuernas+tecnica'},
{id:'onearm_row2',name:'Remo a una mano con mancuerna',sets:3,reps:'10-12/lado',rest:90,muscle:'Espalda',cue:'Segundo estímulo semanal de espalda. Lleva el codo hacia la cadera.',img:'https://i.ytimg.com/vi/pYcpY20QaE8/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=remo+una+mano+mancuerna+tecnica'},
{id:'incline_db2',name:'Press inclinado con mancuernas',sets:3,reps:'8-12',rest:90,muscle:'Pecho',cue:'Segundo estímulo semanal de pecho. Mantén las escápulas apoyadas.',img:'https://i.ytimg.com/vi/0G2_XV7slIg/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=press+inclinado+mancuernas+tecnica'},
{id:'lateral',name:'Elevaciones laterales',sets:3,reps:'12-20',rest:60,muscle:'Hombro lateral',cue:'Sube sin impulso y controla la bajada; no necesitas mucho peso.',img:'https://i.ytimg.com/vi/3VcKaXpzqRo/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=elevaciones+laterales+mancuernas+tecnica'},
{id:'hammer2',name:'Curl martillo',sets:3,reps:'10-15',rest:75,muscle:'Bíceps',cue:'Sin balanceo; controla la excéntrica.',img:'https://i.ytimg.com/vi/zC3nLlEvin4/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=curl+martillo+tecnica'},
{id:'skull2',name:'Tríceps tumbado con barra EZ',sets:3,reps:'10-15',rest:75,muscle:'Tríceps',cue:'Codos estables y recorrido cómodo.',img:'https://i.ytimg.com/vi/d_KZxkY_0cM/hqdefault.jpg',video:'https://www.youtube.com/results?search_query=rompecraneos+barra+ez+tecnica'}]}
];
const STORE_KEY='adriFitV3';
let db=loadDB(); let screen='train',day=0,start=Date.now(),timer=null,remaining=0,currentExercise='',deferredPrompt=null;
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadDB(){try{const v=JSON.parse(localStorage.getItem(STORE_KEY));if(v&&v.days){v.active=v.active||{};v.sessions=Array.isArray(v.sessions)?v.sessions:[];v.notes=v.notes||{};v.settings={weightStep:2,restAuto:true,...(v.settings||{})};v.body={height:v.body?.height||1.65,currentWeight:v.body?.currentWeight||'',history:Array.isArray(v.body?.history)?v.body.history:[]};
// Migraciones de la rutina oficial ADRI Fit, conservando historial y pesos guardados.
const monday=v.days?.[0]?.ex||[];const oldBench=monday.findIndex(e=>e.id==='bench_db'||e.name==='Press banca con mancuernas');if(oldBench>=0){monday[oldBench]=clone(DEFAULT_DAYS[0].ex[0]);delete v.active['bench_db'];}
const oldClose=monday.findIndex(e=>e.id==='close_push');if(oldClose>=0){monday[oldClose]=clone(DEFAULT_DAYS[0].ex.find(e=>e.id==='db_fly'));delete v.active['close_push'];}
const thu=v.days?.[2]?.ex||[];if(thu.length&&!thu.some(e=>e.id==='calves')){const coreIdx=thu.findIndex(e=>e.id==='abwheel2');const calf=clone(DEFAULT_DAYS[2].ex.find(e=>e.id==='calves'));if(coreIdx>=0)thu.splice(coreIdx,0,calf);else thu.push(calf);}
if(v.days?.[3]){const fri=v.days[3];fri.title='Torso B + Brazos';const desired=DEFAULT_DAYS[3].ex;const existing=Object.fromEntries((fri.ex||[]).map(e=>[e.id,e]));fri.ex=desired.map(d=>({...clone(d),...(existing[d.id]?{id:d.id}: {})}));['shoulderpress','lateral'].forEach(id=>{delete v.active[id]});}
saveMigrated(v);return v}}catch{}return {days:clone(DEFAULT_DAYS),active:{},sessions:[],notes:{},settings:{weightStep:2,restAuto:true},body:{height:1.65,currentWeight:'',history:[]},created:new Date().toISOString()}}
function saveMigrated(v){try{localStorage.setItem(STORE_KEY,JSON.stringify(v))}catch{}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(db))}
function exKey(di,ei){return db.days[di].ex[ei]?.id||`d${di}e${ei}`}
function getActive(di,ei){const ex=db.days[di].ex[ei],k=exKey(di,ei);if(!db.active[k])db.active[k]={sets:Array.from({length:+ex.sets},()=>({kg:'',reps:'',done:false}))};while(db.active[k].sets.length<+ex.sets)db.active[k].sets.push({kg:'',reps:'',done:false});return db.active[k]}
function nav(){const el=$('mainnav'); if(!el) return; el.innerHTML=[['train','🏋️ Entrenar'],['history','📅 Historial'],['progress','📈 Progreso'],['settings','⚙️ Ajustes']].map(([k,l])=>`<button class="navbtn ${screen===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(k){screen=k;nav();render()}
function render(){if(screen==='train')renderTrain();if(screen==='history')renderHistory();if(screen==='progress')renderProgress();if(screen==='settings')renderSettings()}
function renderTrain(){const d=db.days[day];screenEl().innerHTML=`<div class="daytabs">${db.days.map((x,i)=>`<button class="tab ${i===day?'active':''}" onclick="switchDay(${i})">${x.name}</button>`).join('')}</div><div class="summary"><div class="stat"><b id="doneSets">0</b><span>series hechas</span></div><div class="stat"><b id="volume">0</b><span>kg de volumen</span></div><div class="stat"><b id="elapsed">00:00</b><span>tiempo sesión</span></div></div><div class="panel"><b>${d.title}</b><div class="small">Marca cada serie al terminar. El descanso arranca automáticamente.</div></div>${d.ex.map((e,ei)=>card(e,ei)).join('')}<button class="finish" onclick="finishWorkout()">Finalizar entrenamiento</button>`;updateStats()}
function screenEl(){return document.getElementById('screen')}
function switchDay(i){day=i;start=Date.now();renderTrain()}
function parseMax(reps){const m=String(reps).match(/(\d+)(?!.*\d)/);return m?+m[1]:12}
function parseMin(reps){const m=String(reps).match(/\d+/);return m?+m[0]:8}
function exerciseHistory(id){return db.sessions.flatMap(s=>s.exercises.filter(e=>e.id===id).map(e=>({...e,date:s.date}))).sort((a,b)=>new Date(a.date)-new Date(b.date))}
function suggestion(ex){const h=exerciseHistory(ex.id);if(!h.length)return 'Primera sesión: empieza con un peso cómodo y deja 2-3 repeticiones en reserva.';const last=h[h.length-1];const completed=last.sets.filter(s=>+s.reps>0);if(!completed.length)return 'Repite un peso cómodo y céntrate en técnica.';const target=parseMax(ex.reps);const min=parseMin(ex.reps);const allTop=completed.every(s=>+s.reps>=target);const minKg=Math.min(...completed.map(s=>+s.kg||0));const maxKg=Math.max(...completed.map(s=>+s.kg||0));if(allTop&&maxKg>0)return `Progresión: la última vez llegaste al tope. Prueba aprox. ${fmt(maxKg+(+db.settings.weightStep||2))} kg si puedes mantener al menos ${min} reps.`;return `Objetivo de hoy: mantén ~${fmt(maxKg)} kg e intenta sumar 1 repetición en alguna serie antes de subir peso.`}
function fmt(n){return Number.isInteger(n)?String(n):Number(n).toFixed(1).replace('.',',')}
function card(ex,ei){const a=getActive(day,ei),hist=exerciseHistory(ex.id),last=hist.length?hist[hist.length-1]:null;return `<section class="exercise"><div class="hero" onclick="openImage('${esc(ex.img)}','${esc(ex.name)}','${esc(ex.video)}')"><img src="${esc(ex.img)}" onerror="this.style.opacity=.15" alt="${esc(ex.name)}"><div class="hero-tools"><button class="hero-chip" onclick="event.stopPropagation();openImage('${esc(ex.img)}','${esc(ex.name)}','${esc(ex.video)}')">🖼 Ver imagen</button></div><div class="hero-title"><h2>${esc(ex.name)}</h2><div class="meta">${esc(ex.muscle)} · ${ex.sets} series · ${esc(ex.reps)} reps · ${ex.rest}s descanso</div></div></div><div class="body"><div class="cue">${esc(ex.cue)}</div><div class="suggest">💡 <b>Siguiente objetivo:</b> ${suggestion(ex)}</div><div class="sets-head"><span>Serie</span><span>kg</span><span>reps</span><span>✓</span></div>${a.sets.slice(0,+ex.sets).map((x,si)=>`<div class="setrow"><div class="setnum">${si+1}</div><input inputmode="decimal" placeholder="${last?.sets?.[si]?.kg||'kg'}" value="${esc(x.kg)}" onchange="upd(${ei},${si},'kg',this.value)"><input inputmode="numeric" placeholder="${last?.sets?.[si]?.reps||ex.reps}" value="${esc(x.reps)}" onchange="upd(${ei},${si},'reps',this.value)"><button class="check ${x.done?'done':''}" onclick="toggleSet(${ei},${si})">${x.done?'✓':'○'}</button></div>`).join('')}<div class="prev">${last?`Última vez: ${last.sets.map(x=>`${x.kg||'-'}kg×${x.reps||'-'}`).join(' · ')}`:'Todavía no hay sesión previa'}</div>${db.notes[ex.id]?`<div class="small" style="margin-top:7px">📝 ${esc(db.notes[ex.id])}</div>`:''}<div class="small" style="margin-top:7px">Toca la imagen para verla completa sin abrir el vídeo.</div><div class="actions"><button class="btn video" onclick="window.open('${esc(ex.video)}','_blank')">▶ Técnica</button><button class="btn note" onclick="note(${ei})">📝 Nota</button><button class="btn ghost" onclick="editExercise(${day},${ei})">✏️ Editar</button></div></div></section>`}
function upd(ei,si,f,v){getActive(day,ei).sets[si][f]=v;save();updateStats()}
function toggleSet(ei,si){const ex=db.days[day].ex[ei],s=getActive(day,ei).sets[si];s.done=!s.done;save();renderTrain();if(s.done&&db.settings.restAuto)startRest(ex.rest,ex.name)}
function startRest(sec,name){clearInterval(timer);remaining=sec;currentExercise=name; const bar=$('timerbar'), ex=$('timerExercise'), t=$('toast'); if(bar) bar.classList.add('show'); if(ex) ex.textContent=name; tickTimer(); timer=setInterval(()=>{remaining--; tickTimer(); if(remaining<=0){clearInterval(timer); if(bar) bar.classList.remove('show'); if(t) t.classList.add('show'); try{navigator.vibrate&&navigator.vibrate([250,150,250])}catch{} setTimeout(()=>{if(t) t.classList.remove('show')},2200)}},1000)}
function tickTimer(){const r=$('timerRing'); if(r) r.textContent=remaining; document.title=remaining>0?`${remaining}s · ADRI Fit`:'ADRI Fit'}
function changeTimer(n){remaining=Math.max(0,remaining+n);tickTimer()} function skipTimer(){clearInterval(timer);remaining=0; const bar=$('timerbar'); if(bar) bar.classList.remove('show'); document.title='ADRI Fit'}
function note(ei){const ex=db.days[day].ex[ei],v=prompt('Nota para '+ex.name+':',db.notes[ex.id]||'');if(v!==null){db.notes[ex.id]=v;save();renderTrain()}}
function openImage(img,name,video){modal(`<div class="modalhead"><h3>${esc(name)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="imgmodal"><img src="${esc(img)}" alt="${esc(name)}" onerror="this.style.opacity=.2"><div class="imghelp">Vista ampliada de la imagen del ejercicio. Si quieres más detalle, también puedes abrir la técnica en vídeo.</div><div class="actions"><button class="btn video" onclick="window.open('${esc(video)}','_blank')">▶ Abrir técnica</button><button class="btn ghost" onclick="closeModal()">Cerrar</button></div></div>`)}
function getBodyHistory(){return (db.body?.history||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date))}
function latestWeight(){const hist=getBodyHistory();if(db.body?.currentWeight) return +db.body.currentWeight||0; return hist.length?(+hist[hist.length-1].weight||0):0}
function saveWeight(){const inp=document.getElementById('bodyWeightInput'); if(!inp) return; const w=parseFloat(String(inp.value).replace(',','.')); if(!w||w<25||w>300){alert('Introduce un peso válido en kg.'); return} db.body=db.body||{height:1.65,currentWeight:'',history:[]}; db.body.currentWeight=w; const today=new Date().toISOString().slice(0,10); const idx=db.body.history.findIndex(x=>String(x.date).slice(0,10)===today); const entry={date:new Date().toISOString(),weight:w}; if(idx>=0) db.body.history[idx]=entry; else db.body.history.push(entry); save(); toastMsg('Peso guardado ✅'); renderProgress()}
function toastMsg(msg){const t=$('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); setTimeout(()=>{t.classList.remove('show'); t.textContent='Descanso terminado 🔔'},1800)}
function drawWeightChart(){const canvas=document.getElementById('weightChart'); if(!canvas) return; const hist=getBodyHistory().slice(-12); const ctx=canvas.getContext('2d'); const ratio=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight; canvas.width=w*ratio; canvas.height=h*ratio; ctx.scale(ratio,ratio); ctx.clearRect(0,0,w,h); ctx.strokeStyle='#24344d'; ctx.fillStyle='#94a3b8'; ctx.font='11px system-ui'; for(let i=0;i<5;i++){const y=20+i*(h-50)/4; ctx.beginPath(); ctx.moveTo(38,y); ctx.lineTo(w-10,y); ctx.stroke()} if(!hist.length){ctx.fillText('Guarda varios pesos para ver la tendencia.',45,h/2); return} const vals=hist.map(x=>+x.weight||0); const mn=Math.min(...vals)-1, mx=Math.max(...vals)+1; ctx.strokeStyle='#a78bfa'; ctx.lineWidth=3; ctx.beginPath(); vals.forEach((v,i)=>{const x=45+i*((w-65)/Math.max(1,vals.length-1)),y=20+(mx-v)/(mx-mn||1)*(h-55); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); ctx.fillStyle='#ddd6fe'; ctx.fillRect(x-3,y-3,6,6)}); ctx.stroke(); ctx.fillStyle='#94a3b8'; ctx.fillText('Peso corporal (kg)',8,12); ctx.fillText((vals[vals.length-1]||'')+' kg',w-58,12)}
function updateStats(){let done=0,vol=0;db.days[day].ex.forEach((e,ei)=>getActive(day,ei).sets.forEach(s=>{if(s.done){done++;vol+=(parseFloat(s.kg)||0)*(parseFloat(s.reps)||0)}}));const ds=document.getElementById('doneSets'),vv=document.getElementById('volume');if(ds)ds.textContent=done;if(vv)vv.textContent=Math.round(vol)}
setInterval(()=>{const el=document.getElementById('elapsed');if(!el)return;const t=Math.floor((Date.now()-start)/1000),m=String(Math.floor(t/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');el.textContent=`${m}:${s}`},1000)
function finishWorkout(){const exercises=[];db.days[day].ex.forEach((ex,ei)=>{const sets=getActive(day,ei).sets.filter(s=>s.done&&((+s.reps||0)>0||(+s.kg||0)>0));if(sets.length)exercises.push({id:ex.id,name:ex.name,muscle:ex.muscle,sets:clone(sets)})});if(!exercises.length){alert('Aún no has marcado ninguna serie completada.');return}const duration=Math.max(1,Math.round((Date.now()-start)/60000));db.sessions.push({id:'s'+Date.now(),date:new Date().toISOString(),day:db.days[day].name,title:db.days[day].title,duration,exercises});db.days[day].ex.forEach((ex,ei)=>getActive(day,ei).sets.forEach(s=>s.done=false));save();start=Date.now();alert('Entrenamiento guardado ✅');renderTrain()}
function renderHistory(){const now=new Date(),year=now.getFullYear(),month=now.getMonth();const first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;const doneDates=new Set(db.sessions.map(s=>new Date(s.date).toDateString()));let cal=['L','M','X','J','V','S','D'].map(x=>`<div class="dow">${x}</div>`).join('')+Array(offset).fill('<div></div>').join('');for(let i=1;i<=days;i++){const dt=new Date(year,month,i),has=doneDates.has(dt.toDateString()),today=dt.toDateString()===now.toDateString();cal+=`<div class="calday ${has?'has':''} ${today?'today':''}">${i}</div>`}const list=[...db.sessions].reverse().slice(0,30).map(s=>{const vol=s.exercises.reduce((a,e)=>a+e.sets.reduce((x,z)=>x+(+z.kg||0)*(+z.reps||0),0),0);return `<div class="histrow"><b>${new Date(s.date).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})} · ${esc(s.title)}</b><div class="small">${s.exercises.reduce((a,e)=>a+e.sets.length,0)} series · ${Math.round(vol)} kg volumen · ${s.duration||'-'} min</div></div>`}).join('');screenEl().innerHTML=`<div class="panel"><div class="section-title"><h2>Calendario</h2><span class="badge">${db.sessions.length} sesiones</span></div><div class="calendar">${cal}</div></div><div class="panel"><h3 style="margin-top:0">Últimos entrenamientos</h3>${list||'<div class="small">Cuando termines tu primera sesión aparecerá aquí.</div>'}</div>`}
function getPRs(){const out={};db.sessions.forEach(s=>s.exercises.forEach(e=>e.sets.forEach(z=>{const kg=+z.kg||0,reps=+z.reps||0,est=reps?kg*(1+reps/30):kg;if(!out[e.id]||est>out[e.id].est)out[e.id]={name:e.name,kg,reps,est,date:s.date}})));return Object.values(out).sort((a,b)=>b.est-a.est)}
function muscleSets(){const out={};const cutoff=Date.now()-7*864e5;db.sessions.filter(s=>new Date(s.date).getTime()>=cutoff).forEach(s=>s.exercises.forEach(e=>out[e.muscle]=(out[e.muscle]||0)+e.sets.length));return out}
function renderProgress(){const prs=getPRs().slice(0,8),mus=muscleSets(),max=Math.max(1,...Object.values(mus),1);const options=[];db.days.forEach(d=>d.ex.forEach(e=>{if(!options.some(x=>x.id===e.id))options.push(e)}));const hist=getBodyHistory(),cw=latestWeight(),h=+db.body?.height||1.65,bmi=cw&&h?cw/(h*h):0,delta=hist.length>=2?((+hist[hist.length-1].weight||0)-(+hist[hist.length-2].weight||0)):0;screenEl().innerHTML=`<div class="panel"><div class="section-title"><h2>Peso corporal</h2><span class="badge">seguimiento</span></div><div class="weightrow"><div class="field"><label>Peso actual (kg)</label><input id="bodyWeightInput" inputmode="decimal" placeholder="70" value="${db.body?.currentWeight||''}"></div><button class="btn primary" style="flex:0;min-width:130px" onclick="saveWeight()">Guardar peso</button></div><div class="substats"><div class="substat"><b>${cw?fmt(cw):'-'}</b><span>kg actuales</span></div><div class="substat"><b>${fmt(h)}</b><span>altura (m)</span></div><div class="substat"><b>${cw?fmt(bmi):'-'}</b><span>IMC orientativo</span></div></div><div class="chartwrap" style="margin-top:10px"><canvas id="weightChart"></canvas></div><div class="small" style="margin-top:8px">${hist.length?`Último cambio registrado: ${delta>0?'+':''}${fmt(delta)} kg respecto al anterior`:'Empieza guardando tu peso una vez por semana, por ejemplo siempre al levantarte y en condiciones parecidas.'}</div><div class="weighthist">${hist.slice(-6).reverse().map(x=>`<div class="weightitem"><span class="small">${new Date(x.date).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</span><b>${fmt(x.weight)} kg</b></div>`).join('')||'<div class="small">Todavía no hay registros de peso.</div>'}</div></div><div class="panel"><div class="section-title"><h2>Progreso de fuerza</h2><span class="badge">últimos datos</span></div><div class="field"><label>Gráfica por ejercicio</label><select id="chartEx" onchange="drawProgressChart(this.value)">${options.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="chartwrap"><canvas id="progressChart"></canvas></div></div><div class="panel"><h3 style="margin-top:0">Series por músculo · últimos 7 días</h3>${Object.entries(mus).map(([m,n])=>`<div class="musclerow"><span class="small">${esc(m)}</span><div class="bar"><i style="width:${Math.round(n/max*100)}%"></i></div><b>${n}</b></div>`).join('')||'<div class="small">Todavía no hay sesiones esta semana.</div>'}</div><div class="panel"><h3 style="margin-top:0">Récords personales</h3>${prs.map(p=>`<div class="histrow"><b class="pr">🏆 ${esc(p.name)}</b><div class="small">Mejor serie registrada: ${fmt(p.kg)} kg × ${p.reps} · ${new Date(p.date).toLocaleDateString('es-ES')}</div></div>`).join('')||'<div class="small">Tus récords aparecerán aquí al guardar entrenamientos.</div>'}</div>`;setTimeout(()=>{const sel=document.getElementById('chartEx');if(sel)drawProgressChart(sel.value);drawWeightChart()},0)}
function drawProgressChart(id){const canvas=document.getElementById('progressChart');if(!canvas)return;const ctx=canvas.getContext('2d'),hist=exerciseHistory(id).slice(-12);const ratio=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*ratio;canvas.height=h*ratio;ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#24344d';ctx.fillStyle='#94a3b8';ctx.font='11px system-ui';for(let i=0;i<5;i++){const y=20+i*(h-50)/4;ctx.beginPath();ctx.moveTo(38,y);ctx.lineTo(w-10,y);ctx.stroke()}if(!hist.length){ctx.fillText('Guarda varias sesiones para ver la evolución.',45,h/2);return}const vals=hist.map(e=>Math.max(...e.sets.map(s=>(+s.kg||0)*(1+(+s.reps||0)/30))));const mn=Math.min(...vals)*.95,mx=Math.max(...vals)*1.05||1;ctx.strokeStyle='#38bdf8';ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>{const x=45+i*((w-65)/Math.max(1,vals.length-1)),y=20+(mx-v)/(mx-mn||1)*(h-55);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);ctx.fillStyle='#a5f3fc';ctx.fillRect(x-3,y-3,6,6)});ctx.stroke();ctx.fillStyle='#94a3b8';ctx.fillText('Fuerza estimada',8,12);ctx.fillText(fmt(vals[vals.length-1])+' kg',w-65,12)}
function renderSettings(){screenEl().innerHTML=`<div class="panel"><h2 style="margin-top:0">Ajustes</h2><div class="grid2"><div class="field"><label>Incremento que sugiere la progresión (kg)</label><input type="number" step="0.5" value="${db.settings.weightStep||2}" onchange="db.settings.weightStep=+this.value||2;save()"></div><div class="field"><label>Altura (m)</label><input type="number" step="0.01" value="${db.body?.height||1.65}" onchange="db.body=db.body||{};db.body.height=+this.value||1.65;save()"></div></div><div class="field"><label><input type="checkbox" ${db.settings.restAuto?'checked':''} onchange="db.settings.restAuto=this.checked;save()"> Iniciar descanso automáticamente al completar una serie</label></div></div><div class="panel"><div class="section-title"><h3>Rutina y ejercicios</h3><button class="btn ghost" style="flex:0" onclick="addExercise(${day})">+ Añadir</button></div><div class="daytabs">${db.days.map((x,i)=>`<button class="tab ${i===day?'active':''}" onclick="day=${i};renderSettings()">${x.name}</button>`).join('')}</div><div class="editor-list">${db.days[day].ex.map((e,i)=>`<div class="editor-item"><b>${esc(e.name)}</b><span class="small">${esc(e.muscle)} · ${e.sets}×${esc(e.reps)} · ${e.rest}s</span><div class="editor-actions"><button class="mini" onclick="editExercise(${day},${i})">Editar</button><button class="mini" onclick="moveExercise(${day},${i},-1)">↑</button><button class="mini" onclick="moveExercise(${day},${i},1)">↓</button><button class="mini" onclick="deleteExercise(${day},${i})">Eliminar</button></div></div>`).join('')}</div></div><div class="panel"><h3 style="margin-top:0">Copia de seguridad</h3><div class="actions"><button class="btn ghost" onclick="exportData()">Exportar datos</button><button class="btn ghost" onclick="importData()">Importar datos</button></div><div class="help" style="margin-top:8px">Los datos viven en este navegador. Exporta una copia de vez en cuando si quieres poder restaurarlos en otro móvil.</div></div><div class="panel"><h3 style="margin-top:0">Instalar como app</h3><div class="help">En Android/Chrome aparecerá el botón “Instalar” cuando la web esté servida por HTTPS. En iPhone: Safari → Compartir → “Añadir a pantalla de inicio”.</div></div>`}
function modal(html){const el=$('modalRoot'); if(!el) return; el.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox">${html}</div></div>`} function closeModal(){$('modalRoot').innerHTML=''}
function editExercise(di,ei){const e=db.days[di].ex[ei];modal(`<div class="modalhead"><h3>Editar ejercicio</h3><button class="close" onclick="closeModal()">×</button></div>${exerciseForm(e)}<button class="finish" onclick="saveExercise(${di},${ei})">Guardar cambios</button>`)}
function addExercise(di){const e={id:'custom_'+Date.now(),name:'Nuevo ejercicio',sets:3,reps:'8-12',rest:90,muscle:'Otro',cue:'',img:'',video:'https://www.youtube.com'};modal(`<div class="modalhead"><h3>Añadir ejercicio</h3><button class="close" onclick="closeModal()">×</button></div>${exerciseForm(e)}<button class="finish" onclick="saveExercise(${di},-1,'${e.id}')">Añadir</button>`)}
function exerciseForm(e){return `<div class="field"><label>Nombre</label><input id="f_name" value="${esc(e.name)}"></div><div class="grid2"><div class="field"><label>Series</label><input id="f_sets" type="number" min="1" value="${e.sets}"></div><div class="field"><label>Repeticiones</label><input id="f_reps" value="${esc(e.reps)}"></div></div><div class="grid2"><div class="field"><label>Descanso (segundos)</label><input id="f_rest" type="number" value="${e.rest}"></div><div class="field"><label>Músculo</label><input id="f_muscle" value="${esc(e.muscle)}"></div></div><div class="field"><label>Clave técnica</label><textarea id="f_cue">${esc(e.cue)}</textarea></div><div class="field"><label>URL de foto</label><input id="f_img" value="${esc(e.img)}"></div><div class="field"><label>URL vídeo/técnica</label><input id="f_video" value="${esc(e.video)}"></div>`}
function saveExercise(di,ei,newId){const old=ei>=0?db.days[di].ex[ei]:null;const e={id:old?.id||newId||('custom_'+Date.now()),name:($('f_name')?.value||'').trim()||'Ejercicio',sets:Math.max(1,+($('f_sets')?.value)||3),reps:($('f_reps')?.value||'').trim()||'8-12',rest:Math.max(15,+($('f_rest')?.value)||90),muscle:($('f_muscle')?.value||'').trim()||'Otro',cue:($('f_cue')?.value||'').trim(),img:($('f_img')?.value||'').trim(),video:($('f_video')?.value||'').trim()||'https://www.youtube.com'};if(ei>=0)db.days[di].ex[ei]=e;else db.days[di].ex.push(e);save();closeModal();render()}
function moveExercise(di,ei,delta){const arr=db.days[di].ex,ni=ei+delta;if(ni<0||ni>=arr.length)return;[arr[ei],arr[ni]]=[arr[ni],arr[ei]];save();renderSettings()}
function deleteExercise(di,ei){if(!confirm('¿Eliminar este ejercicio de la rutina? El historial guardado no se borra.'))return;db.days[di].ex.splice(ei,1);save();renderSettings()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='adri-fit-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){const input=document.createElement('input');input.type='file';input.accept='application/json';input.onchange=()=>{const f=input.files[0],r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.days||!Array.isArray(x.sessions))throw 0;db=x;save();render();alert('Copia restaurada ✅')}catch{alert('El archivo no parece una copia válida de ADRI Fit.')}};r.readAsText(f)};input.click()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=$('installBtn'); if(b) b.classList.remove('hidden')}); const _btn=$('installBtn'); if(_btn){_btn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;_btn.classList.add('hidden')}}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
nav();render();
</script>
